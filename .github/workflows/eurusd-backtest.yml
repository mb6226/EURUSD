name: EURUSD precision research
on:
  workflow_dispatch:
    inputs:
      signal:
        description: Baseline signal family
        required: true
        type: choice
        options: [both, momentum, breakout]
        default: both
      train_cutoff:
        description: Optional UTC cutoff date YYYY-MM-DD
        required: false
        type: string
  push:
    paths:
      - scripts/**
      - .github/workflows/eurusd-backtest.yml
      - data/**
permissions:
  contents: read
  actions: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Download latest successful EURUSD M1 data artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.name | startswith("eurusd-dukascopy-m1-")) | select(.expired == false)] | sort_by(.created_at) | last // empty')"
          if [ -z "$artifact" ]; then
            echo "::error::No unexpired EURUSD M1 data artifact found. Run the download-eurusd-m1 workflow first."
            exit 1
          fi
          artifact_name="$(jq -r .name <<< "$artifact")"
          run_id="$(jq -r .workflow_run.id <<< "$artifact")"
          echo "Using artifact: $artifact_name (run $run_id)"
          mkdir -p data
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir data
          test -s data/eurusd_m1.csv
          echo "Input file: data/eurusd_m1.csv"
      - name: Validate data and show range
        run: |
          python - <<'PY'
          import pandas as pd
          p = "data/eurusd_m1.csv"
          d = pd.read_csv(p)
          required = {"timestamp", "bid_open", "bid_high", "bid_low", "bid_close",
                      "ask_open", "ask_high", "ask_low", "ask_close"}
          missing = required - set(d.columns)
          if missing:
              raise SystemExit(f"Missing required Bid/Ask columns: {sorted(missing)}")
          d["timestamp"] = pd.to_datetime(d["timestamp"], utc=True)
          if d["timestamp"].duplicated().any():
              raise SystemExit("Duplicate timestamps found")
          print(f"Rows: {len(d):,}; first: {d.timestamp.min()}; last: {d.timestamp.max()}")
          PY
      - name: Run baseline backtests
        env:
          SIGNAL: ${{ inputs.signal || 'both' }}
          CUTOFF: ${{ inputs.train_cutoff }}
        shell: bash
        run: |
          args=(--input data/eurusd_m1.csv --output reports/results.csv --summary-output reports/summary.csv --spread-pips 1 --signal "$SIGNAL")
          if [ -n "$CUTOFF" ]; then args+=(--train-cutoff "$CUTOFF"); fi
          python scripts/backtest.py "${args[@]}"
      - name: Run sell-every-pip grid test (SL 2, TP 60)
        run: python scripts/backtest_sell_every_pip.py --input data/eurusd_m1.csv --output reports/sell_every_pip_trades.csv --summary-output reports/sell_every_pip_summary.csv --step-pips 1 --sl-pips 2 --tp-pips 60
      - name: Analyze time-of-day and future excursions
        run: python scripts/find_patterns.py --input data/eurusd_m1.csv --output reports/pattern_diagnostics.csv
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: eurusd-research-results
          path: reports/*.csv
          if-no-files-found: error
